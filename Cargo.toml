[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
nuxut-accounts = { version = "0.2.0-alpha.1", path = "crates/nuxut-accounts" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
url = { version = "2.5", features = ["serde"] }
# HTTP: framework'ün SSRF'ye dayanıklı istemcisi (ureq + rustls/ring + sistem kökleri; tokio yok).
nuxut-net = { version = "0.2.0-alpha.1", path = "../framework/crates/nuxut-net" }
# Secret Service istemcisi; async-io yürütücüsü (zbus ile aynı), saf Rust kripto. Bkz. ADR-0002.
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
zbus = "5.16"
futures-lite = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
